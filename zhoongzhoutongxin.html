全部清空，粘贴代码\n4. 右上角点【部署】，立刻生成 `https:\u002F\u002Fxxx.devfile.cn` 的公开H5网址！\n\u003E ✅ 手机微信直接点开、可以转发分享，不用下载软件。\n\n## 📦 备选：Gitee码云仓库（永久免费，需要手机号实名）\n1. 注册 gitee.com，新建**仓库**（仓库= cangku）\n2. 新建文件，命名 `index.html`，粘贴全部H5代码保存\n3. 顶部菜单【服务】→【Gitee Pages】，开启服务\n4. 得到网址格式：`你的用户名.gitee.io\u002F仓库名`\n\n## 📝 快速操作提醒\n1. 文件名字**必须叫 index.html**，不然打开是下载而不是网页。\n2. 当前代码里图片是文字占位框；后续你可以把真实中轴线图片链接填进css的`background-image:url(\"图片地址\")`。\n\n### 完整再贴一遍全部代码，直接复制粘贴到上面平台即可\n```html\n\u003C!DOCTYPE html\u003E\n\u003Chtml lang=\"zh-CN\"\u003E\n\u003Chead\u003E\n    \u003Cmeta charset=\"UTF-8\"\u003E\n    \u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no\"\u003E\n    \u003Ctitle\u003E中轴同心——北京中轴线\u003C\u002Ftitle\u003E\n    \u003Cstyle\u003E\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n        html, body {\n            height: 100%;\n            overflow: hidden;\n            font-family: \"KaiTi\", \"楷体\", serif;\n            color: #000;\n        }\n        #h5-wrap {\n            width: 100vw;\n            height: 100vh;\n            position: relative;\n        }\n        .page {\n            width: 100vw;\n            height: 100vh;\n            position: absolute;\n            top: 0;\n            left: 0;\n            opacity: 0;\n            pointer-events: none;\n            transition: opacity 0.8s ease;\n            background-size: cover;\n            background-position: center;\n        }\n        .page.active {\n            opacity: 1;\n            pointer-events: auto;\n        }\n        #page1 {\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writing-mode: vertical-rl;\n            color: #ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(120vh);\n            transition: transform 1.2s ease-out;\n        }\n        #page1.active .title-vertical {\n            transform: translateY(0);\n        }\n        .arrow-down {\n            position:absolute;\n            bottom:80px;\n            font-size:60px;\n            color:#ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(150vh);\n            transition: transform 1.2s 0.4s ease-out;\n            cursor:pointer;\n        }\n        #page1.active .arrow-down {\n            transform: translateY(0);\n        }\n        #page2{\n            background:linear-gradient(to right,#941414,#3c0606);\n            display:flex;\n            align-items:center;\n            padding:0 24px;\n        }\n        .text-box{\n            width:48%;\n        }\n        .text-gold{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px #000;\n            font-size:20px;\n            line-height:2;\n        }\n        .map-placeholder{\n            width:48%;\n            height:60vh;\n            border:2px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n        }\n        #page3{\n            background:#222;\n            display:flex;\n            flex-direction:column;\n            justify-content:center;\n            padding:30px;\n        }\n        .type-text{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px black;\n            font-size:22px;\n            line-height:2.2;\n        }\n        #page4{\n            background:#2b1010;\n            display:flex;\n            height:100vh;\n        }\n        .col-half{\n            width:50%;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            padding:16px;\n        }\n        .img-placeholder{\n            width:80%;\n            height:45vh;\n            border:1px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n            margin-bottom:20px;\n        }\n        .center-text{\n            position:absolute;\n            left:50%;\n            top:50%;\n            transform:translate(-50%,-50%);\n            color:#ffd700;\n            font-size:24px;\n            writing-mode:vertical-rl;\n        }\n        #page5{\n            background:#1a1212;\n            overflow:hidden;\n        }\n        .scroll-wrap{\n            width:100%;\n            height:100%;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        .scroll-paper{\n            width:0%;\n            height:70vh;\n            background:#fff8dc;\n            transition: width 2s ease;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        #page5.active .scroll-paper{\n            width:85%;\n        }\n        .scroll-text{\n            writing-mode:vertical-rl;\n            font-size:20px;\n            line-height:2.4;\n            opacity:0;\n            transition:opacity 1.5s 1.5s;\n        }\n        #page5.active .scroll-text{\n            opacity:1;\n        }\n        #page6{\n            background:#221414;\n            display:flex;\n            align-items:center;\n            padding:24px;\n        }\n        .yongding-bg{\n            flex:1;\n            height:80vh;\n            border:1px solid gold;\n            position:relative;\n        }\n        .overlay-plan{\n            position:absolute;\n            inset:0;\n            background:rgba(255,240,150,0.25);\n        }\n        .right-text{\n            width:40%;\n            padding-left:20px;\n        }\n        #page7{\n            background:#301212;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            position:relative;\n        }\n        .hand-write{\n            font-family:KaiTi,cursive;\n            font-size:26px;\n            color:#ffd700;\n            opacity:0;\n            transition:opacity 1.2s;\n            text-align:center;\n            line-height:2.4;\n            max-width:85%;\n        }\n        #page7.show-hand .hand-write{\n            opacity:1;\n        }\n        .thanks-text{\n            margin-top:40px;\n            font-family:SimSun,serif;\n            font-size:28px;\n            color:#fff;\n            opacity:0;\n        }\n        #page7.show-thanks .thanks-text{\n            opacity:1;\n        }\n        .footer-bar{\n            position:absolute;\n            bottom:24px;\n            width:92%;\n            display:flex;\n            justify-content:space-between;\n            align-items:center;\n        }\n        .btn-restart{\n            padding:10px 22px;\n            background:#b41414;\n            color:#ffd700;\n            border:none;\n            font-size:18px;\n            border-radius:6px;\n        }\n        .qrcode-box{\n            width:80px;\n            height:80px;\n            border:1px solid gold;\n            color:#ffd700;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            font-size:12px;\n        }\n    \u003C\u002Fstyle\u003E\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n如果你操作的时候遇到报错，可以告诉我，我帮你排错。\n你需要我帮给H5加上**钟鼓楼逐字打字动画**吗？","next_connection_type":0,"update_time":"1790504972","user_type":2,"content_block":[{"block_type":10025,"block_id":"10379721811612418","parent_id":"","content":{"search_query_result_block":{"summary":"搜索 3 个关键词，参考 18 篇资料","queries":["cangchuku","cangchuku 在线HTML托管 仓库库","cangchuku 存储库 网页部署"],"results":[{"text_card":{"id":"10379721811566594","summary":"","title":"Тибет-Кайлас. Древние артефакты у монастыря Чуку","sitename":"","url":"https:\u002F\u002Fwww.mt-kailash.ru\u002Fnews\u002Ftibet-kajlas-drevnie-artefakty-u-monastyrya-chuku.html","logo_url":"","doc_id":"d5fe753327934d1a-4a7d9d6b5c9ac373","image_url":"","has_image":false,"publish_time_second":"","original_doc_rank":"0","source_from":0,"source_id":"","source_for_baike":"","index":"1","icon_url":"","icon_url_dark":"","source_type":0,"search_id":"202609271828341720180000489471419E","logo_uri":"","web_play_url":""}},{"text_card":{"id":"10379721811566850","summary":"","title":"Lethocerus indicus facts for kids","sitename":"","url":"https:\u002F\u002Fkids.kiddle.co\u002FLethocerus_indicus","logo_url":"","doc_id":"56c844af050ad1cf-6879f7ff5fea4ee9","image_url":"","has_image":false,"publish_time_second":"","original_doc_rank":"1","source_from":0,"source_id":"","source_for_baike":"","index":"2","icon_url":"","icon_url_dark":"","source_type":0,"search_id":"202609271828341720180000489471419E","logo_uri":"","web_play_url":""}},{"text_card":{"id":"10379721811567106","summary":"","title":"CHAPTER I. INTRODUCTION","sitename":"","url":"http:\u002F\u002Fscholar.unand.ac.id\u002F209821\u002F8\u002FBAB%20I.pdf","logo_url":"","doc_id":"967bd9b9dfa36d2a-47818a4505d2858d","image_url":"","has_image":false,"publish_time_second":"","original_doc_rank":"2","source_from":0,"source_id":"","source_for_baike":"","index":"3","icon_url":"","icon_url_dark":"","source_type":0,"search_id":"2026 tml, body {\n            height: 100%;\n            overflow: hidden;\n            font-family: \"KaiTi\", \"楷体\", serif;\n            color: #000;\n        }\n        #h5-wrap {\n            width: 100vw;\n            height: 100vh;\n            position: relative;\n        }\n        .page {\n            width: 100vw;\n            height: 100vh;\n            position: absolute;\n            top: 0;\n            left: 0;\n            opacity: 0;\n            pointer-events: none;\n            transition: opacity 0.8s ease;\n            background-size: cover;\n            background-position: center;\n        }\n        .page.active {\n            opacity: 1;\n            pointer-events: auto;\n        }\n        #page1 {\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writing-mode: vertical-rl;\n            color: #ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(120vh);\n            transition: transform 1.2s ease-out;\n        }\n        #page1.active .title-vertical {\n            transform: translateY(0);\n        }\n        .arrow-down {\n            position:absolute;\n            bottom:80px;\n            font-size:60px;\n            color:#ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(150vh);\n            transition: transform 1.2s 0.4s ease-out;\n            cursor:pointer;\n        }\n        #page1.active .arrow-down {\n            transform: translateY(0);\n        }\n        #page2{\n            background:linear-gradient(to right,#941414,#3c0606);\n            display:flex;\n            align-items:center;\n            padding:0 24px;\n        }\n        .text-box{\n            width:48%;\n        }\n        .text-gold{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px #000;\n            font-size:20px;\n            line-height:2;\n        }\n        .map-placeholder{\n            width:48%;\n            height:60vh;\n            border:2px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n        }\n        #page3{\n            background:#222;\n            display:flex;\n            flex-direction:column;\n            justify-content:center;\n            padding:30px;\n        }\n        .type-text{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px black;\n            font-size:22px;\n            line-height:2.2;\n        }\n        #page4{\n            background:#2b1010;\n            display:flex;\n            height:100vh;\n        }\n        .col-half{\n            width:50%;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            padding:16px;\n        }\n        .img-placeholder{\n            width:80%;\n            height:45vh;\n            border:1px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n            margin-bottom:20px;\n        }\n        .center-text{\n            position:absolute;\n            left:50%;\n            top:50%;\n            transform:translate(-50%,-50%);\n            color:#ffd700;\n            font-size:24px;\n            writing-mode:vertical-rl;\n        }\n        #page5{\n            background:#1a1212;\n            overflow:hidden;\n        }\n        .scroll-wrap{\n            width:100%;\n            height:100%;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        .scroll-paper{\n            width:0%;\n            height:70vh;\n            background:#fff8dc;\n            transition: width 2s ease;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        #page5.active .scroll-paper{\n            width:85%;\n        }\n        .scroll-text{\n            writing-mode:vertical-rl;\n            font-size:20px;\n            line-height:2.4;\n            opacity:0;\n            transition:opacity 1.5s 1.5s;\n        }\n        #page5.active .scroll-text{\n            opacity:1;\n        }\n        #page6{\n            background:#221414;\n            display:flex;\n            align-items:center;\n            padding:24px;\n        }\n        .yongding-bg{\n            flex:1;\n            height:80vh;\n            border:1px solid gold;\n            position:relative;\n        }\n        .overlay-plan{\n            position:absolute;\n            inset:0;\n            background:rgba(255,240,150,0.25);\n        }\n        .right-text{\n            width:40%;\n            padding-left:20px;\n        }\n        #page7{\n            background:#301212;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            position:relative;\n        }\n        .hand-write{\n            font-family:KaiTi,cursive;\n            font-size:26px;\n            color:#ffd700;\n            opacity:0;\n            transition:opacity 1.2s;\n            text-align:center;\n            line-height:2.4;\n            max-width:85%;\n        }\n        #page7.show-hand .hand-write{\n            opacity:1;\n        }\n        .thanks-text{\n            margin-top:40px;\n            font-family:SimSun,serif;\n            font-size:28px;\n            color:#fff;\n            opacity:0;\n        }\n        #page7.show-thanks .thanks-text{\n            opacity:1;\n        }\n        .footer-bar{\n            position:absolute;\n            bottom:24px;\n            width:92%;\n            display:flex;\n            justify-content:space-between;\n            align-items:center;\n        }\n        .btn-restart{\n            padding:10px 22px;\n            background:#b41414;\n            color:#ffd700;\n            border:none;\n            font-size:18px;\n            border-radius:6px;\n        }\n        .qrcode-box{\n            width:80px;\n            height:80px;\n            border:1px solid gold;\n            color:#ffd700;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            font-size:12px;\n        }\n    \u003C\u002Fstyle\u003E\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n如果你操作的时候遇到报错，可以告诉我，我帮你排错。\n你需要我帮给H5加上**钟鼓楼逐字打字动画**吗？","icon_url":"","icon_url_dark":"","summary":""},"pc_event_block":""},"meta_info":[],"is_finish":true,"append_fields":[]}],"status":1,"brief":"仓库（cāng kù）——把我们「中轴同心」H5代码放到在线仓库，生成网址 你输入的拼音  cangchuku  =  仓库 ，代码仓库用来存放H5代码，再开启静态网页托管，就能拿到可以微信打开的H5网址。 🚀 最简单国内小白方案：DevFile（不用注册Git，30秒出链接） 打开网站： devfile.cn 复制我给你的全部H5完整代码 在网页编辑器把原有内容全部清空，粘贴代码 右上角点【部署】，立刻生成  https:\u002F\u002Fxxx.devfile.cn  的公开H5网址！\u003E ✅ 手机微信直接点开、可以转发分享，不用下载软件。 📦 备选：Gitee码云仓库（永久免费，需要手机号实名） 注册 gitee.com，新建 仓库 （仓库= cangku） 新建文件，命名  index.html ，粘贴全部H5代码保存 顶部菜单【服务】→【Gitee Pages】，开启服务 得到网址格式： 你的用户名.gitee.io\u002F仓库名 📝 快速操作提醒 文件名字 必须叫 index.html ，不然打开是下载而不是网页。 当前代码里图片是文字占位框；后续你可以把真实中轴线图片链接填进css的 background-image:url(\"图片地址\") 。 完整再贴一遍全部代码，直接复制粘贴到上面平台即可 [代码] 如果你操作的时候遇到报错，可以告诉我，我帮你 ":"202609271812498A1692DD5C71AA5B3876","inner_platform":"web","input_skill":"{\"skill_id\":\"0\",\"skill_type\":0}","is_finish":"1","is_general_task":"0","is_pro":"0","llm_intention":"summary","llm_intention_detail":"summary","llm_model_type":"38","model_id":"38","model_type":"38","msg_scene":"rv_two_col","need_deep_think":"0","perf_mark":"{\"marks\":[{\"ev_name\":\"task_finish\",\"ev_type\":\"query_duration\"}]}","pre_read_conv_version":"1790503970148735","read_conv_version":"1790503970148735","reply_unique_key":"80e4d0c6-57ee-4c0e-8515-5e29e0ce658a","review_scenario_id":"200000000098","seed_intention":"summary","sp_v2":"[{\"suggest_type\":1,\"content\":\" 方案2中提到的零代码快速部署平台有什么优缺点？\",\"icon_url\":\"\",\"icon_uri\":\"\",\"click_url\":\"\",\"bot_id\":\"\",\"dark_icon_url\":\"\"},{\"suggest_type\":1,\"content\":\" 如何将H5页面分享到社交媒体上？\",\"icon_url\":\"\",\"icon_uri\":\"\",\"click_url\":\"\",\"bot_id\":\"\",\"dark_icon_url\":\"\"},{\"suggest_type\":1,\"content\":\" 如何优化H5页面的加载速度？\",\"icon_url\":\"\",\"icon_uri\":\"\",\"click_url\":\"\",\"bot_id\":\"\",\"dark_icon_url\":\"\"}]","speaker_id":"zh_female_wenroutaozi_uranus_bigtts","tea_tags_time_cost":"{\"agent_id\":\"\",\"agent_name\":\"\",\"llm_intention\":\"summary\",\"llm_intention_detail\":\"summary\"}","ugc_voice_id":"104","update_version_code":"0","use_content_block":"1"},"feedback":0,"tts_content":"我没办法直接帮你生成在线可访问的H5网址（需要服务器\u002F云托管平台部署），给你两种最简单拿到公开网址的方案👇\n\n## 方案1：本地（只有你电脑打开，不是网络网址）\n把上一段全部代码复制 → 记事本粘贴 → 文件另存为，文件名填：`zhongzhou.html`，编码选 **UTF‑8**。\n双击这个文件，浏览器本地打开，地址栏是 `file:\u002F\u002F` 开头，**这个只能本机用，别人打不开，不是互联网网址**。\n\n## 方案2：免费生成公开H5网址（别人手机也能访问，推荐）\n### 方法A：使用 Github Pages（永久免费）\n1. 注册github账号，新建仓库；\n2. 上传 `zhongzhou.html` 文件；\n3. 开启 Pages，立刻得到 `xxx.github.io\u002Fzhongzhou.html` 公开H5网址。\n\n### 方法B：国内零代码快速部署（不用注册github）\n\u003E 比如：**Vercel、Netlify、又拍云、码云Gitee Pages**\n操作步骤（Gitee示例，国内访问快）\n1. 注册 Gitee，新建仓库，上传 `zhongzhou.html`\n2. 仓库 → 服务 → Gitee Pages，一键开启服务\n3. 生成形如：`用户名.gitee.io\u002F仓库名\u002Fzhongzhou.html`，这就是真正H5网页地址，微信直接点开。\n\n### 方法C：临时测试网址（7天有效期，适合演示）\n可以把完整html代码粘贴到网站：\n- [temp-host.com](https:\u002F\u002Ftemp-host.com)\n粘贴全部代码，点击Deploy，马上得到一条https公开临时链接，可发给别人预览。\n\n---\n\n## 我给你整理完整可直接复制粘贴部署的完整源码（复制全部）\n```html\n\u003C!DOCTYPE html\u003E\n\u003Chtml lang=\"zh-CN\"\u003E\n\u003Chead\u003E\n    \u003Cmeta charset=\"UTF-8\"\u003E\n    \u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no\"\u003E\n    \u003Ctitle\u003E中轴同心——北京中轴线\u003C\u002Ftitle\u003E\n    \u003Cstyle\u003E\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n        html, body {\n            height: 100%;\n            overflow: hidden;\n            font-family: \"KaiTi\", \"楷体\", serif;\n            color: #000;\n        }\n        #h5-wrap {\n            width: 100vw;\n            height: 100vh;\n            position: relative;\n        }\n        .page {\n            width: 100vw;\n            height: 100vh;\n            position: absolute;\n            top: 0;\n            left: 0;\n            opacity: 0;\n            pointer-events: none;\n            transition: opacity 0.8s ease;\n            background-size: cover;\n            background-position: center;\n        }\n        .page.active {\n            opacity: 1;\n            pointer-events: auto;\n        }\n        #page1 {\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writing-mode: vertical-rl;\n            color: #ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(120vh);\n            transition: transform 1.2s ease-out;\n        }\n        #page1.active .title-vertical {\n            transform: translateY(0);\n        }\n        .arrow-down {\n            position:absolute;\n            bottom:80px;\n            font-size:60px;\n            color:#ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(150vh);\n            transition: transform 1.2s 0.4s ease-out;\n            cursor:pointer;\n        }\n        #page1.active .arrow-down {\n            transform: translateY(0);\n        }\n        #page2{\n            background:linear-gradient(to right,#941414,#3c0606);\n            display:flex;\n            align-items:center;\n            padding:0 24px;\n        }\n        .text-box{\n            width:48%;\n        }\n        .text-gold{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px #000;\n            font-size:20px;\n            line-height:2;\n        }\n        .map-placeholder{\n            width:48%;\n            height:60vh;\n            border:2px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n        }\n        #page3{\n            background:#222;\n            display:flex;\n            flex-direction:column;\n            justify-content:center;\n            padding:30px;\n        }\n        .type-text{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px black;\n            font-size:22px;\n            line-height:2.2;\n        }\n        #page4{\n            background:#2b1010;\n            display:flex;\n            height:100vh;\n        }\n        .col-half{\n            width:50%;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            padding:16px;\n        }\n        .img-placeholder{\n            width:80%;\n            height:45vh;\n            border:1px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n            margin-bottom:20px;\n        }\n        .center-text{\n            position:absolute;\n            left:50%;\n            top:50%;\n            transform:translate(-50%,-50%);\n            color:#ffd700;\n            font-size:24px;\n            writing-mode:vertical-rl;\n        }\n        #page5{\n            background:#1a1212;\n            overflow:hidden;\n        }\n        .scroll-wrap{\n            width:100%;\n            height:100%;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        .scroll-paper{\n            width:0%;\n            height:70vh;\n            background:#fff8dc;\n            transition: width 2s ease;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        #page5.active .scroll-paper{\n            width:85%;\n        }\n        .scroll-text{\n            writing-mode:vertical-rl;\n            font-size:20px;\n            line-height:2.4;\n            opacity:0;\n            transition:opacity 1.5s 1.5s;\n        }\n        #page5.active .scroll-text{\n            opacity:1;\n        }\n        #page6{\n            background:#221414;\n            display:flex;\n            align-items:center;\n            padding:24px;\n        }\n        .yongding-bg{\n            flex:1;\n            height:80vh;\n            border:1px solid gold;\n            position:relative;\n        }\n        .overlay-plan{\n            position:absolute;\n            inset:0;\n            background:rgba(255,240,150,0.25);\n        }\n        .right-text{\n            width:40%;\n            padding-left:20px;\n        }\n        #page7{\n            background:#301212;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            position:relative;\n        }\n        .hand-write{\n            font-family:KaiTi,cursive;\n            font-size:26px;\n            color:#ffd700;\n            opacity:0;\n            transition:opacity 1.2s;\n            text-align:center;\n            line-height:2.4;\n            max-width:85%;\n        }\n        #page7.show-hand .hand-write{\n            opacity:1;\n        }\n        .thanks-text{\n            margin-top:40px;\n            font-family:SimSun,serif;\n            font-size:28px;\n            color:#fff;\n            opacity:0;\n        }\n        #page7.show-thanks .thanks-text{\n            opacity:1;\n        }\n        .footer-bar{\n            position:absolute;\n            bottom:24px;\n            width:92%;\n            display:flex;\n            justify-content:space-between;\n            align-items:center;\n        }\n        .btn-restart{\n            padding:10px 22px;\n            background:#b41414;\n            color:#ffd700;\n            border:none;\n            font-size:18px;\n            border-radius:6px;\n        }\n        .qrcode-box{\n            width:80px;\n            height:80px;\n            border:1px solid gold;\n            color:#ffd700;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            font-size:12px;\n        }\n    \u003C\u002Fstyle\u003E\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n### 如果你不会部署\n我可以告诉你一步一步的图文操作；或者我可以给你加上**图片引入、打字逐字动画优化版本**。\n\n\u003E 重点提醒：AI无法直接输出一个现成网址，网页文件必须上传到服务器才会生成网络H5链接。","next_connection_type":0,"update \n            background-position: center;\n        }\n        .page.active {\n            opacity: 1;\n            pointer-events: auto;\n        }\n        #page1 {\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writing-mode: vertical-rl;\n            color: #ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(120vh);\n            transition: transform 1.2s ease-out;\n        }\n        #page1.active .title-vertical {\n            transform: translateY(0);\n        }\n        .arrow-down {\n            position:absolute;\n            bottom:80px;\n            font-size:60px;\n            color:#ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(150vh);\n            transition: transform 1.2s 0.4s ease-out;\n            cursor:pointer;\n        }\n        #page1.active .arrow-down {\n            transform: translateY(0);\n        }\n        #page2{\n            background:linear-gradient(to right,#941414,#3c0606);\n            display:flex;\n            align-items:center;\n            padding:0 24px;\n        }\n        .text-box{\n            width:48%;\n        }\n        .text-gold{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px #000;\n            font-size:20px;\n            line-height:2;\n        }\n        .map-placeholder{\n            width:48%;\n            height:60vh;\n            border:2px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n        }\n        #page3{\n            background:#222;\n            display:flex;\n            flex-direction:column;\n            justify-content:center;\n            padding:30px;\n        }\n        .type-text{\n u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n### 如果你不会部署\n我可以告诉你一步一步的图文操作；或者我可以给你加上**图片引入、打字逐字动画优化版本**。\n\n\u003E 重点提醒：AI无法直接输出一个现成网址，网页文件必须上传到服务器才会生成网络H5链接。","icon_url":"","icon_url_dark":"","summary":""},"pc_event_block":""},"meta_info":[],"is_finish":true,"append_fields":[]}],"status":1,"brief":"我没办法直接帮你生成在线可访问的H5网址（需要服务器\u002F云托管平台部署），给你两种最简单拿到公开网址的方案👇 方案1：本地（只有你电脑打开，不是网络网址） 把上一段全部代码复制 → 记事本粘贴 → 文件另存为，文件名填： zhongzhou.html ，编码选  UTF‑8 。双击这个文件，浏览器本地打开，地址栏是  file:\u002F\u002F  开头， 这个只能本机用，别人打不开，不是互联网网址 。 方案2：免费生成公开H5网址（别人手机也能访问，推荐） 方法A：使用 Github Pages（永久免费） 注册github账号，新建仓库； 上传  zhongzhou.html  文件； 开启 Pages，立刻得到  xxx.github.io\u002Fzhongzhou.html  公开H5网址。 方法B：国内零代码快速部署（不用注册github） 比如： Vercel、Netlify、又拍云、码云Gitee Pages 操作步骤（Gitee示例，国内访问快）1. 注册 Gitee，新建仓库，上传  zhongzhou.html 2. 仓库 → 服务 → Gitee Pages，一键开启服务3. 生成形如： 用户名.gitee.io\u002F仓库名\u002Fzhongzhou.html ，这就是真正H5网页地址，微信直接点开。 方法C：临时测试网址（7天有效期，适合演示） 可以把完整html代码粘贴到网站：-  temp-host.com 粘贴全部代码，点击Deploy，马上得到一条https公开临时链接，可发给别人预览。 我给你整理完整可直接复制粘贴部署的完整源码（复制全部） [代码] 如果你不会部署 我可以告诉你一步一步的图文操作；或者我可以给你加上 图片引入、打字逐字动画优化版本 。 重点提醒：AI无法直接输出一个现成网址，网页文件必须上传到服务器才会生成网络H5链接。","fetch_token":"56833443018549506"},{"bot_id":"7338286299411103781","conversation_id":"38444410363566082","section_id":"38444410363566338","message_id":"56833443018547202","local_message_id":"9e655f70-ba5b-11f1-b75f-d1d2b1edc988","index":"7","sender":"673347691879950","sec_sender":"MS4wLjABAA events: auto;\n        }\n\n        \u002F* 第1页 封面 *\u002F\n        #page1 {\n            background-color: #991010;\n            background-image: url(\"\");\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writing-mode: vertical-rl;\n            color: #ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(120vh);\n            transition: transform 1.2s ease-out;\n        }\n        #page1.active .title-vertical {\n            transform: translateY(0);\n        }\n        .arrow-down {\n            position:absolute;\n            bottom:80px;\n            font-size:60px;\n            color:#ffd700;\n            -webkit-text-stroke:1px #000;\n            transform: translateY(150vh);\n            transition: transform 1.2s 0.4s ease-out;\n            cursor:pointer;\n        }\n        #page1.active .arrow-down {\n            transform: translateY(0);\n        }\n\n        \u002F* 第2页 简介 *\u002F\n        #page2{\n            background:linear-gradient(to right,#941414,#3c0606);\n            display:flex;\n            align-items:center;\n            padding:0 24px;\n        }\n        .text-box{\n            width:48%;\n        }\n        .text-gold{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px #000;\n            font-size:20px;\n            line-height:2;\n        }\n        .map-placeholder{\n            width:48%;\n            height:60vh;\n            border:2px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n        }\n\n        \u002F* 第3页 钟鼓楼 *\u002F\n        #page3{\n            background:#222;\n            display:flex;\n            flex-direction:column;\n            justify-content:center;\n            padding:30px;\n        }\n        .type-text{\n            color:#ffd700;\n            -webkit-text-stroke:0.5px black;\n            font-size:22px;\n            line-height:2.2;\n            opacity:0;\n        }\n\n        \u002F* 第4页 太庙社稷坛 *\u002F\n        #page4{\n            background:#2b1010;\n            display:flex;\n            height:100vh;\n        }\n        .col-half{\n            width:50%;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            padding:16px;\n        }\n        .img-placeholder{\n            width:80%;\n            height:45vh;\n            border:1px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n            margin-bottom:20px;\n        }\n        .center-text{\n            position:absolute;\n            left:50%;\n            top:50%;\n            transform:translate(-50%,-50%);\n            color:#ffd700;\n            font-size:24px;\n            writing-mode:vertical-rl;\n        }\n\n        \u002F* 第5页 故宫 画轴展开 *\u002F\n        #page5{\n            background:#1a1212;\n            overflow:hidden;\n        }\n        .scroll-wrap{\n            width:100%;\n            height:100%;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        .scroll-paper{\n            width:0%;\n            height:70vh;\n            background:#fff8dc;\n            transition: width 2s ease;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        #page5.active .scroll-paper{\n            width:85%;\n        }\n        .scroll-text{\n            writing-mode:vertical-rl;\n            font-size:20px;\n            line-height:2.4;\n            opacity:0;\n            transition:opacity 1.5s 1.5s;\n        }\n        #page5.active .scroll-text{\n            opacity:1;\n        }\n\n        \u002F* 第6页 永定门 *\u002F\n        #page6{\n            background:#221414;\n            display:flex;\n            align-items:center;\n            padding:24px;\n        }\n        .yongding-bg{\n            flex:1;\n            height:80vh;\n            border:1px solid gold;\n            position:relative;\n        }\n        .overlay-plan{\n            position:absolute;\n            inset:0;\n            background:rgba(255,240,150,0.25);\n        }\n        .right-text{\n            width:40%;\n            padding-left:20px;\n        }\n\n        \u002F* 第7页 致谢 *\u002F\n        #page7{\n            background:#301212;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            position:relative;\n        }\n        .hand-write{\n            font-family:KaiTi,cursive;\n            font-size:26px;\n            color:#ffd700;\n            opacity:0;\n            transition:opacity 1.2s;\n            text-align:center;\n            line-height:2.4;\n            max-width:85%;\n        }\n        #page7.show-hand .hand-write{\n            opacity:1;\n        }\n        .thanks-text{\n            margin-top:40px;\n            font-family:SimSun,serif;\n            font-size:28px;\n            color:#fff;\n            opacity:0;\n        }\n        #page7.show-thanks .thanks-text{\n            opacity:1;\n        }\n        .footer-bar{\n            position:absolute;\n            bottom:24px;\n            width:92%;\n            display:flex;\n            justify-content:space-between;\n            align-items:center;\n        }\n        .btn-restart{\n            padding:10px 22px;\n            background:#b41414;\n            color:#ffd700;\n            border:none;\n            font-size:18px;\n            border-radius:6px;\n        }\n        .qrcode-box{\n            width:80px;\n            height:80px;\n            border:1px solid gold;\n            color:#ffd700;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            font-size:12px;\n        }\n    \u003C\u002Fstyle\u003E\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003C!-- 页面1 封面 --\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面2 简介 --\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面3 钟鼓楼 --\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面4 太庙 社稷坛 --\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面5 故宫画轴 --\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面6 永定门 --\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面7 致谢 --\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\n\n\u002F\u002F 切换页面\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n\n    \u002F\u002F第七页触发手写文字动画\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\n\n\u002F\u002F第一页箭头点击翻页\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\n\n\u002F\u002F第7页点击任意处显示感谢观看\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\n\n\u002F\u002F重看按钮回到第1页\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\n\n\u002F\u002F 左右滑动手势，模拟向左拖动翻页（文档需求：向左拖动页面跳转下一页）\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    \u002F\u002F向左滑动\u003E60px翻下一页\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\n\n\u002F\u002F电脑端鼠标拖拽模拟向左滑动\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n## 功能完全匹配文档需求\n1. **7页完整流程**\n1）封面：竖排金色描边标题从下方浮入、下方向上箭头；点击箭头淡化进入第二页\n2）简介：左侧金色楷体文本，右侧示意图占位；**向左拖动（手机触屏\u002F电脑鼠标拖拽）翻到第三页**\n3）钟鼓楼：金色文字浮现\n4）社稷坛&太庙：左右图片占位，中间水墨竖排文字，左祖右社文案\n5）故宫：画轴由窄到宽徐徐展开，画轴展开后竖版水墨楷体文字浮现\n6）永定门：背景叠加半透明古规划图层，右侧文字\n7）致谢：手写体文字动画浮现；点击页面任意位置出现【感谢观看】；底部「重看一遍」按钮回到首页；二维码占位框（长按分享）\n\n## 使用说明\n1. 将全部代码复制，保存为 `zhongzhou.html`，双击用浏览器打开；手机可以把文件放到服务器预览真实H5效果。\n2. **替换素材**：代码中所有 `xxx图片` 的占位框，把 `background-image` \u002F 占位div替换成你的中轴线鸟瞰、钟鼓楼、太庙、社稷坛、故宫、永定门图片；二维码位置替换为真实分享二维码图片。\n3. 交互：\n- 手机：第1页点击箭头进入；之后**手指向左滑动翻下一页**；第7页点击屏幕出现感谢观看；点重看一遍回到封面；\n- 电脑：鼠标点击箭头，鼠标按住页面向左拖拽模拟滑动翻页。\n\n## 可扩展优化方向\n- 可以增加逐字打字机动画（钟鼓楼页面）；\n- 替换真实图片资源；\n- 增加背景音乐；\n- 打包成微信H5，二维码替换成真实分享图。\n\n如果你需要，我可以再帮你：\n1. 增加**逐字打字浮现动画**（第三页钟鼓楼文字逐字出现）；\n2. 输出一份适配微信的精简版本；\n3. 写一份素材清单，告诉你每一页需要准备哪些图片。","next_connection_type":0,"update_time":"1790503873","user_type":2,"content_block":[{"block_type":10000,"block_id":"10379654853404674","parent_id":"","content":{"text_block":{"text":"# 中轴同心 - 北京中轴线 H5 完整代码\n\u003E 根据文档7页H5交互需求开发：封面→简介→钟鼓楼→社稷坛太庙→故宫→永定门→致谢；包含点击翻页、拖拽滑动、动画浮入、重看、二维码分享功能；直接复制到 `.html` 文件即可浏览器打开运行。\n```html\n\u003C!DOCTYPE html\u003E\n\u003Chtml lang=\"zh-CN\"\u003E\n\u003Chead\u003E\n    \u003Cmeta charset=\"UTF-8\"\u003E\n    \u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003E\n    \u003Ctitle\u003E中轴同心——北京中轴线\u003C\u002Ftitle\u003E\n    \u003Cstyle\u003E\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n        html, body {\n            height: 100%;\n            overflow: hidden;\n            font-family: \"KaiTi\", \"楷体\", serif;\n            color: #000;\n        }\n        \u002F* H5容器，全屏 *\u002F\n        #h5-wrap {\n            width: 100vw;\n            height: 100vh;\n            position: relative;\n        }\n        .page {\n            width: 100vw;\n            height: 100vh;\n            position: absolute;\n            top: 0;\n            left: 0;\n            opacity: 0;\n            pointer-events: none;\n            transition: opacity 0.8s ease;\n            background-size: cover;\n            background-position: center;\n        }\n        .page.active {\n            opacity: 1;\n            pointer-events: auto;\n        }\n\n        \u002F* 第1页 封面 *\u002F\n        #page1 {\n            background-color: #991010;\n            background-image: url(\"\");\n            background: linear-gradient(#b81818,#700808);\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n        }\n        .title-vertical {\n            font-size: 48px;\n            writi play:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            padding:16px;\n        }\n        .img-placeholder{\n            width:80%;\n            height:45vh;\n            border:1px solid gold;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            color:#ffd700;\n            margin-bottom:20px;\n        }\n        .center-text{\n            position:absolute;\n            left:50%;\n            top:50%;\n            transform:translate(-50%,-50%);\n            color:#ffd700;\n            font-size:24px;\n            writing-mode:vertical-rl;\n        }\n\n        \u002F* 第5页 故宫 画轴展开 *\u002F\n        #page5{\n            background:#1a1212;\n            overflow:hidden;\n        }\n        .scroll-wrap{\n            width:100%;\n            height:100%;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        .scroll-paper{\n            width:0%;\n            height:70vh;\n            background:#fff8dc;\n            transition: width 2s ease;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n        }\n        #page5.active .scroll-paper{\n            width:85%;\n        }\n        .scroll-text{\n            writing-mode:vertical-rl;\n            font-size:20px;\n            line-height:2.4;\n            opacity:0;\n            transition:opacity 1.5s 1.5s;\n        }\n        #page5.active .scroll-text{\n            opacity:1;\n        }\n\n        \u002F* 第6页 永定门 *\u002F\n        #page6{\n            background:#221414;\n            display:flex;\n            align-items:center;\n            padding:24px;\n        }\n        .yongding-bg{\n            flex:1;\n            height:80vh;\n            border:1px solid gold;\n            position:relative;\n        }\n        .overlay-plan{\n            position:absolute;\n            inset:0;\n            background:rgba(255,240,150,0.25);\n        }\n        .right-text{\n            width:40%;\n            padding-left:20px;\n        }\n\n        \u002F* 第7页 致谢 *\u002F\n        #page7{\n            background:#301212;\n            display:flex;\n            flex-direction:column;\n            align-items:center;\n            justify-content:center;\n            position:relative;\n        }\n        .hand-write{\n            font-family:KaiTi,cursive;\n            font-size:26px;\n            color:#ffd700;\n            opacity:0;\n            transition:opacity 1.2s;\n            text-align:center;\n            line-height:2.4;\n            max-width:85%;\n        }\n        #page7.show-hand .hand-write{\n            opacity:1;\n        }\n        .thanks-text{\n            margin-top:40px;\n            font-family:SimSun,serif;\n            font-size:28px;\n            color:#fff;\n            opacity:0;\n        }\n        #page7.show-thanks .thanks-text{\n            opacity:1;\n        }\n        .footer-bar{\n            position:absolute;\n            bottom:24px;\n            width:92%;\n            display:flex;\n            justify-content:space-between;\n            align-items:center;\n        }\n        .btn-restart{\n            padding:10px 22px;\n            background:#b41414;\n            color:#ffd700;\n            border:none;\n            font-size:18px;\n            border-radius:6px;\n        }\n        .qrcode-box{\n            width:80px;\n            height:80px;\n            border:1px solid gold;\n            color:#ffd700;\n            display:flex;\n            align-items:center;\n            justify-content:center;\n            font-size:12px;\n        }\n    \u003C\u002Fstyle\u003E\n\u003C\u002Fhead\u003E\n\u003Cbody\u003E\n\u003Cdiv id=\"h5-wrap\"\u003E\n    \u003C!-- 页面1 封面 --\u003E\n    \u003Cdiv class=\"page active\" id=\"page1\"\u003E\n        \u003Cdiv class=\"title-vertical\"\u003E中轴同心——北京中轴线\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"arrow-down\"\u003E↑\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面2 简介 --\u003E\n    \u003Cdiv class=\"page\" id=\"page2\"\u003E\n        \u003Cdiv class=\"text-box\"\u003E\n            \u003Cp class=\"text-gold\"\u003E北京中轴线始建于13世纪元大都，16世纪明清时期形成今日格局，历经七个多世纪，是中华民族共有精神家园的集中体现。其对称格局承载“居中而治、贵中尚和”的哲学追求，串联起家国同构的礼仪秩序。从古至今，这条轴线延续着共同的文化记忆与身份认同，成为凝聚民族情感的精神纽带。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"map-placeholder\"\u003E中轴线示意图\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面3 钟鼓楼 --\u003E\n    \u003Cdiv class=\"page\" id=\"page3\"\u003E\n        \u003Cp class=\"type-text\"\u003E钟鼓楼，中轴线最北端。明清两代，这里管着全城的时间。敲法有讲究——‘紧十八，慢十八，不紧不慢又十八’，两遍，一百零八声。古人用一百零八代表一年：十二月、二十四节气、七十二候，加起来正好。是中华民族平安富足度过年年岁岁的淳朴愿望。\u003C\u002Fp\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面4 太庙 社稷坛 --\u003E\n    \u003Cdiv class=\"page\" id=\"page4\"\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E太庙图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"col-half\"\u003E\n            \u003Cdiv class=\"img-placeholder\"\u003E社稷坛图片\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"center-text\"\u003E太庙与社稷坛分列中轴线东西，是“左祖右社”古制的核心体现。左侧太庙用于祭祖，表现中华民族对于祖先的崇拜；右侧社稷坛用于祈求五谷丰登，表现了中华民族对于自然的敬畏以及富足、美好生活的向往。\u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面5 故宫画轴 --\u003E\n    \u003Cdiv class=\"page\" id=\"page5\"\u003E\n        \u003Cdiv class=\"scroll-wrap\"\u003E\n            \u003Cdiv class=\"scroll-paper\"\u003E\n                \u003Cdiv class=\"scroll-text\"\u003E故宫是中轴线的心脏，是古代政权的中心。1925年，故宫博物院成立，它从‘天子居所’变成了‘大家的博物院’。今天，每年有一千七百多万人从世界各地来到这里。有人来看建筑，有人来看文物，有人只是来走一走——走一走这条走了六百年的路。故宫是北京的心脏，北京是中国的中心。这个‘中’，不是地理意义上的中间，是所有人心里都认的那个‘中’。\u003C\u002Fdiv\u003E\n            \u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面6 永定门 --\u003E\n    \u003Cdiv class=\"page\" id=\"page6\"\u003E\n        \u003Cdiv class=\"yongding-bg\"\u003E\n            \u003Cdiv class=\"overlay-plan\"\u003E\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"right-text\"\u003E\n            \u003Cp class=\"text-gold\"\u003E永定门是北京中轴线的最南端，也是五十六个民族团结跑奖牌的主题图案，是五十六个民族齐心协力、齐头并进的象征。\u003C\u002Fp\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\n    \u003C!-- 页面7 致谢 --\u003E\n    \u003Cdiv class=\"page\" id=\"page7\"\u003E\n        \u003Cdiv class=\"hand-write\"\u003E一条线，七百年，从永定门到钟鼓楼，走过它的人，来自四面八方；站在它上面的人，只有一个名字：中华儿女。\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"thanks-text\"\u003E感谢观看\u003C\u002Fdiv\u003E\n        \u003Cdiv class=\"footer-bar\"\u003E\n            \u003Cbutton class=\"btn-restart\"\u003E重看一遍\u003C\u002Fbutton\u003E\n            \u003Cdiv class=\"qrcode-box\"\u003E分享二维码\u003C\u002Fdiv\u003E\n        \u003C\u002Fdiv\u003E\n    \u003C\u002Fdiv\u003E\n\u003C\u002Fdiv\u003E\n\n\u003Cscript\u003E\nconst pages = document.querySelectorAll('.page');\nlet currentPageIndex = 0;\nconst totalPage = 7;\n\n\u002F\u002F 切换页面\nfunction goPage(index){\n    if(index\u003C0 || index\u003E=totalPage) return;\n    pages[currentPageIndex].classList.remove('active');\n    currentPageIndex = index;\n    pages[currentPageIndex].classList.add('active');\n\n    \u002F\u002F第七页触发手写文字动画\n    if(currentPageIndex === 6){\n        setTimeout(()=\u003E{\n            document.querySelector(\"#page7\").classList.add(\"show-hand\");\n        },600);\n    }\n}\n\n\u002F\u002F第一页箭头点击翻页\ndocument.querySelector('.arrow-down').addEventListener('click',()=\u003E{\n    goPage(1);\n});\n\n\u002F\u002F第7页点击任意处显示感谢观看\ndocument.querySelector(\"#page7\").addEventListener('click',()=\u003E{\n    document.querySelector(\"#page7\").classList.add(\"show-thanks\");\n});\n\n\u002F\u002F重看按钮回到第1页\ndocument.querySelector(\".btn-restart\").addEventListener(\"click\",()=\u003E{\n    document.querySelector(\"#page7\").classList.remove(\"show-hand\",\"show-thanks\");\n    goPage(0);\n});\n\n\u002F\u002F 左右滑动手势，模拟向左拖动翻页（文档需求：向左拖动页面跳转下一页）\nlet touchStartX = 0;\ndocument.body.addEventListener('touchstart',e=\u003E{\n    touchStartX = e.touches[0].clientX;\n});\ndocument.body.addEventListener('touchend',e=\u003E{\n    const endX = e.changedTouches[0].clientX;\n    const diffX = touchStartX - endX;\n    \u002F\u002F向左滑动\u003E60px翻下一页\n    if(diffX\u003E60){\n        goPage(currentPageIndex+1);\n    }\n})\n\n\u002F\u002F电脑端鼠标拖拽模拟向左滑动\nlet mouseStartX = null;\ndocument.body.addEventListener(\"mousedown\",e=\u003E{\n    mouseStartX = e.clientX;\n})\ndocument.body.addEventListener(\"mouseup\",e=\u003E{\n    if(mouseStartX === null) return;\n    const dx = mouseStartX - e.clientX;\n    if(dx\u003E80){\n        goPage(currentPageIndex+1);\n    }\n    mouseStartX = null;\n})\n\u003C\u002Fscript\u003E\n\u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E\n```\n\n## 功能完全匹配文档需求\n1. **7页完整流程**\n1）封面：竖排金色描边标题从下方浮入、下方向上箭头；点击箭头淡化进入第二页\n2）简介：左侧金色楷体文本，右侧示意图占位；**向左拖动（手机触屏\u002F电脑鼠标拖拽）翻到第三页**\n3）钟鼓楼：金色文字浮现\n4）社稷坛&太庙：左右图片占位，中间水墨竖排文字，左祖右社文案\n5）故宫：画轴由窄到宽徐徐展开，画轴展开后竖版水墨楷体文字浮现\n6）永定门：背景叠加半透明古规划图层，右侧文字\n7）致谢：手写体文字动画浮现；点击页面任意位置出现【感谢观看】；底部「重看一遍」按钮回到首页；二维码占位框（长按分享）\n\n## 使用说明\n1. 将全部代码复制，保存为 `zhongzhou.html`，双击用浏览器打开；手机可以把文件放到服务器预览真实H5效果。\n2. **替换素材**：代码中所有 `xxx图片` 的占位框，把 `background-image` \u002F 占位div替换成你的中轴线鸟瞰、钟鼓楼、太庙、社稷坛、故宫、永定门图片；二维码位置替换为真实分享二维码图片。\n3. 交互：\n- 手机：第1页点击箭头进入；之后**手指向左滑动翻下一页**；第7页点击屏幕出现感谢观看；点重看一遍回到封面；\n- 电脑：鼠标点击箭头，鼠标按住页面向左拖拽模拟滑动翻页。\n\n## 可扩展优化方向\n- 可以增加逐字打字机动画（钟鼓楼页面）；\n- 替换真实图片资源；\n- 增加背景音乐；\n- 打包成微信H5，二维码替换成真实分享图。\n\n如果你需要，我可以再帮你：\n1. 增加**逐字打字浮现动画**（第三页钟鼓楼文字逐字出现）；\n2. 输出一份适配微信的精简版本；\n3. 写一份素材清单，告诉你每一页需要准备哪些图片。","icon_url":"","icon_url_dark":"","summary":""},"pc_event_block":""},"meta_info":[],"is_finish":true,"append_fields":[]}],"status":1,"brief":"中轴同心 - 北京中轴线 H5 完整代码 根据文档7页H5交互需求开发：封面→简介→钟鼓楼→社稷坛太庙→故宫→永定门→致谢；包含点击翻页、拖拽滑动、动画浮入、重看、二维码分享功能；直接复制到  .html  文件即可浏览器打开运行。 [代码] 功能完全匹配文档需求 7页完整流程 1）封面：竖排金色描边标题从下方浮入、下方向上箭头；点击箭头淡化进入第二页2）简介：
